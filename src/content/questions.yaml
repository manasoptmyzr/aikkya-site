# Questions people ask before they come, shown in this order (by the number at the start).
# Prices are not here: they come from src/site.ts.

01-getting-here:
  q: How do we get there?
  a: >-
    Aikkya is on Seetla Road near Mukteshwar, in Nainital district. The nearest
    railway station is Kathgodam, about two and a half hours away by taxi. The
    nearest airport is Pantnagar, about three hours by road. From Delhi it's
    roughly 340 km by road. We'll send you the map pin and directions on WhatsApp
    before you come.

02-steps:
  q: Can we drive right up?
  a: >-
    You can park on the property and then walk up. Some rooms are a climb: Sabi is
    about 108 steps from the parking. If steps are hard for anyone in your group,
    tell us when you write.

03-included:
  q: What's included?
  a: >-
    Breakfast. Lunch and dinner are cooked here if you'd like them, and charged
    separately. We all eat in the dining lounge, not in the rooms.

04-food:
  q: What's the food like?
  a: >-
    Home cooking. Some days pahadi food, some days something else entirely. The
    bread is baked here, the coffee comes from Coorg and is ground every morning,
    and when the orchard gives enough, the jams and chutneys are from our own
    fruit. Tell us what you don't eat.

05-drinks:
  q: Can we drink?
  a: >-
    Yes. Bring your own bottle and Avijeet will happily mix something with it.

06-dogs:
  q: Can we bring our dog?
  a: >-
    Usually, yes. Tell us when you write. Our own dogs live here and will want to
    meet yours.

07-work:
  q: Is there wifi? Can I work from there?
  a: >-
    There's wifi, and people do work from here. Power cuts happen in the hills,
    usually for 10 to 15 minutes, and an inverter keeps the wifi going.

08-winter:
  q: Is it cold in winter?
  a: >-
    Yes, it can drop to zero. The rooms have electric blankets and hot water, and
    the lounge has a wood-burning stove.

09-monsoon:
  q: Is it safe to come in the monsoon?
  a: >-
    Yes, and it's one of the most beautiful times to be here. Now and then some mud
    or stones slip onto the road, and they get cleared quickly. Check with us
    before you travel and we'll tell you how the roads are.

10-farm:
  q: Anything else we should know?
  a: >-
    It's a working farm. The cows call in the mornings and there are insects.
    Water is scarce up here, so please use it carefully. Toilet paper goes in the
    bin, not the toilet. There's no room service, and rooms are cleaned when you
    ask. Evenings are quiet, so no loud music, please.

11-times:
  q: What time is check-in?
  a: >-
    Check-in is from 2 pm and check-out is by 11 am.

12-to-do:
  q: What is there to do?
  a: >-
    Not much, on purpose. Walk the orchard and the forest trails, hike up to
    Seetla market, or to the viewpoint for Nanda Devi on a clear day. Read in the
    sun room, sit on the deck for the sunset. We can arrange yoga, meditation or
    art sessions if you'd like.
