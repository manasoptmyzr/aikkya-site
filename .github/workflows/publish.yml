# Every change pushed to main goes live on www.aikkya.in in about two minutes.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Tells Bing (and the other IndexNow search engines) which pages exist, so
  # changes reach Bing (which ChatGPT search and Copilot use) sooner.
  # If it fails (for example before the domain is connected), the site is still live.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      HOST: www.aikkya.in
      KEY: b56aa06014ef120a25d9bcb3623bfcf5
    steps:
      - run: |
          # Only once the site is really being served at $HOST (before go-live it isn't).
          if [ "$(curl -fsSL https://$HOST/$KEY.txt 2>/dev/null)" != "$KEY" ]; then
            echo "Site isn't live at $HOST yet; nothing to notify."
            exit 0
          fi
          urls=$(curl -fsSL https://$HOST/sitemap-0.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":$urls}"
